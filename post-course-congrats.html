<!-- Posit Academy — Post-Course Congratulations + Completion Badge -->
<!-- Paste this into the SkillJar rating lesson's Summary field.
     The script injects the banner, a live-rendered completion badge, and
     share buttons into the main lesson content area, above the rating widget.

     Badge data sources (all client-side, SkillJar remains system of record):
       - Learner name:  window.skilljarUser.name
       - Course title:  window.skilljarCourse.title
       - Cert link:     scraped from SkillJar's certificate anchor when the
                        course has certificates enabled in SkillJar admin.
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;600&display=swap');

/* ── Banner ── */
#pa-congrats-banner {
  background: linear-gradient(135deg, #17212B 0%, #3A5672 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 48px;
  text-align: center;
}

#pa-congrats-logo {
  height: 60px;
  width: auto;
  display: block;
  margin-bottom: 32px;
}

#pa-congrats-heading {
  font-family: 'Open Sans', sans-serif !important;
  font-size: clamp(28px, 5vw, 48px) !important;
  font-weight: 500 !important;
  color: #ffffff !important;
  margin: 0 0 12px 0 !important;
  line-height: 1.15 !important;
}

#pa-congrats-sub {
  font-family: 'Open Sans', sans-serif !important;
  font-size: clamp(14px, 2vw, 17px) !important;
  font-weight: 400 !important;
  color: rgba(255, 255, 255, 0.78) !important;
  margin: 0 !important;
  line-height: 1.6 !important;
  max-width: 500px !important;
}

/* Compact header — used once the badge is revealed: the dark banner gives
   way to a plain typographic congrats on white, since the badge itself
   carries the celebration and the brand color. */
#pa-congrats-banner.pa-compact {
  background: #ffffff;
  padding: 40px 24px 4px;
}
.pa-compact #pa-congrats-logo { display: none; }
.pa-compact #pa-congrats-heading {
  color: #17212B !important;
  font-size: 34px !important;
  margin: 0 0 6px 0 !important;
}
.pa-compact #pa-congrats-sub {
  color: #5b6a76 !important;
  font-size: 15px !important;
}

/* Confetti button restyled when it joins the button row on white */
.pa-congrats-btn-confetti.pa-in-row {
  color: #17212B;
  border-color: #F6B000 !important;
  margin-top: 0 !important;
}

/* ── Badge section: centered card with note below ── */
#pa-badge-row {
  display: none;
  background: #ffffff;
  padding: 28px 24px 4px;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
#pa-badge-row.pa-visible { display: flex; }

#pa-badge-card {
  position: relative;
  width: 100%;
  max-width: 720px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 16px 40px -12px rgba(23, 33, 43, 0.35);
  line-height: 0;
}

#pa-badge-card svg {
  width: 100%;
  height: auto;
  display: block;
}

#pa-badge-sheen {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, 0.32) 50%, transparent 58%);
  transform: translateX(-130%);
}

#pa-badge-note {
  font-family: 'Open Sans', sans-serif !important;
  font-size: 12px !important;
  color: #6c7a86 !important;
  margin: 0 !important;
  line-height: 1.5 !important;
  text-align: center;
}

/* Sticker-settle entrance + one sheen sweep */
@media (prefers-reduced-motion: no-preference) {
  #pa-badge-card {
    animation: pa-badge-settle 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  #pa-badge-sheen {
    animation: pa-badge-sheen 1.4s ease-out 0.6s forwards;
  }
}

@keyframes pa-badge-settle {
  from { opacity: 0; transform: scale(1.05) rotate(-1.5deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

@keyframes pa-badge-sheen {
  to { transform: translateX(130%); }
}

/* ── Button row ── */
#pa-congrats-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  padding: 32px 24px 32px;
  background: #ffffff;
}

/* Normalized hard against SkillJar's site CSS so <a> and <button> render
   identically: fixed height, flex centering, explicit line-height. */
.pa-congrats-btn {
  font-family: 'Open Sans', sans-serif !important;
  font-size: 13px !important;
  font-weight: 700 !important;
  letter-spacing: 0.08em !important;
  text-transform: uppercase !important;
  text-decoration: none !important;
  border-radius: 4px !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  box-sizing: border-box !important;
  height: 48px !important;
  padding: 0 28px !important;
  margin: 0 !important;
  line-height: 1 !important;
  border: 1px solid transparent !important;
  transition: background-color 0.15s, color 0.15s;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

/* Primary — dark filled */
.pa-congrats-btn-primary {
  background: #17212B;
  color: #ffffff;
}
.pa-congrats-btn-primary:hover {
  background: #213D4F;
  color: #ffffff;
}

/* Secondary — Academy Yellow */
.pa-congrats-btn-secondary {
  background: #F6B000;
  color: #17212B;
}
.pa-congrats-btn-secondary:hover {
  background: #C48F0A;
  color: #17212B;
}

/* Ghost — quiet nav links */
.pa-congrats-btn-ghost {
  background: transparent;
  color: #17212B;
  border-color: #D1DBE5 !important;
}
.pa-congrats-btn-ghost:hover {
  background: #F5F7F9;
  color: #17212B;
}

/* Confetti trigger — outlined yellow, sits inside the dark banner */
.pa-congrats-btn-confetti {
  background: transparent;
  color: #ffffff;
  border: 2px solid #F6B000 !important;
  cursor: pointer;
  margin-top: 28px !important;
}
.pa-congrats-btn-confetti:hover {
  background: #F6B000;
  color: #17212B;
}

/* ── Divider between congrats and rating widget ── */
#pa-congrats-divider {
  height: 1px;
  background: #E8ECEF;
  margin: 0 24px 32px;
}

/* ── Responsive ── */
@media only screen and (max-width: 480px) {
  .pa-congrats-btn {
    width: 100%;
    text-align: center;
  }
  #pa-congrats-buttons {
    flex-direction: column;
    align-items: center;
    padding: 24px 20px;
  }
  #pa-badge-row.pa-visible {
    padding: 24px 16px 4px;
  }
}
</style>

<script>

  /* ── Data ── */
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function learnerName() {
    if (window.skilljarUser && window.skilljarUser.name) return window.skilljarUser.name;
    return 'Posit Academy Learner';
  }

  function courseTitle() {
    if (window.skilljarCourse && window.skilljarCourse.title) return window.skilljarCourse.title;
    return document.title.replace(/\s*[-–|].*$/, '');
  }

  function issueDate() {
    return new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // SkillJar exposes the learner's certificate on lesson pages via
  // skilljarCourseProgress.certificate.url (per SkillJar's developer-center
  // snippet "Add Certificate View & Share to LinkedIn Buttons").
  function findCertUrl() {
    var p = window.skilljarCourseProgress;
    return (p && p.certificate && p.certificate.url) ? p.certificate.url : null;
  }

  // On first completion the certificate is issued *after* this page was
  // rendered — the rating lesson usually completes the course only when the
  // learner submits a rating, and the post-course trigger fires after that.
  // Re-fetch the current page for up to ~2 minutes and pull the certificate
  // URL out of the fresh HTML once SkillJar has issued it.
  function extractCertUrl(html) {
    /* Normalize escaped JSON (\" and \/) so one regex covers JSON, escaped
       JSON-in-string, and JS-literal serializations of the global. */
    var norm = html.replace(/\\(["'\/])/g, '$1');
    var m = norm.match(/["']?certificate["']?\s*:\s*\{[^{}]*?["']?url["']?\s*:\s*["']([^"']+)["']/);
    return m ? m[1] : null;
  }

  function pollCertUrl(onFound) {
    var attempts = 0;
    var maxAttempts = 30; /* x 4s = ~2 minutes */
    console.debug('[pa-badge] no certificate at page load; polling for one');
    var timer = setInterval(function () {
      attempts++;
      if (attempts > maxAttempts) {
        clearInterval(timer);
        console.debug('[pa-badge] gave up polling — no certificate after ~2 min');
        return;
      }
      fetch(window.location.href, { credentials: 'same-origin' })
        .then(function (r) { return r.text(); })
        .then(function (html) {
          var url = extractCertUrl(html);
          if (url) {
            clearInterval(timer);
            console.debug('[pa-badge] certificate found on attempt ' + attempts + ': ' + url);
            onFound(url);

    } else {
      q.push('organizationName=' + encodeURIComponent(ISSUER_NAME));

    if (shareUrl) {
      q.push('certUrl=' + encodeURIComponent(shareUrl));
      if (certId) q.push('certId=' + encodeURIComponent(certId));

    return 'https://www.linkedin.com/profile/add?' + q.join('&');

      /* Inside the hex: wordmark, spark divider, course title */
      PARTNER_READINESS_LOGO,
      '<rect x="375" y="455" width="50" height="5" fill="#EE6331"/>',
      '<text text-anchor="middle" font-family="\'Open Sans\', sans-serif" font-weight="600" font-size="', fit.fontSize,
        '" fill="#404041">', tspans, '</text>',

      /* Right column: presented-to, name, rule, issued */
      '<text x="800" y="480" font-family="\'Open Sans\', sans-serif" font-weight="400" font-size="32" fill="#ffffff">Presented to</text>',
      '<text x="800" y="', (480 + 16 + nameFs), '" font-family="\'Open Sans\', sans-serif" font-weight="600" font-size="', nameFs,
        '" fill="#ffffff">', name, '</text>',
      '<rect x="800" y="608" width="220" height="3" fill="#EE6331"/>',
      '<text x="800" y="676" font-family="\'Source Code Pro\', monospace" font-weight="600" font-size="23" letter-spacing="3" fill="#ffffff">ISSUED ',
        date.toUpperCase(), '</text>',

      '</svg>'
    ].join('');
  }

  /* ── Confetti ── */
  function loadConfetti(cb) {
    if (window.confetti) { cb(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';
    s.onload = cb;
    document.head.appendChild(s);
  }

  function fireConfetti() {
    var colors = ['#F6B000', '#F4C540', '#447099', '#D1DBE5', '#ffffff', '#ED632F', '#EDCCBF'];
    var count  = 180;
    var origin = {
      x: Math.random(),
      y: Math.random() * 0.4 + 0.3
    };
    function fire(ratio, opts) {
      confetti(Object.assign({
        particleCount: Math.floor(count * ratio),
        colors: colors,
        origin: origin
      }, opts));
    }
    fire(0.25, { spread: 26,  startVelocity: 55 });
    fire(0.20, { spread: 60 });
    fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
    fire(0.10, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
    fire(0.10, { spread: 120, startVelocity: 45 });
  }

  /* ── Injection ── */
  function injectCongrats() {
    if (document.getElementById('pa-congrats-banner')) return; /* already injected */

    var target = document.getElementById('lesson-main-content');
    if (!target) return;

    var wrapper = document.createElement('div');
    wrapper.innerHTML = [
      '<div id="pa-congrats-banner">',
        '<img id="pa-congrats-logo"',
             'src="', LOGO_REVERSE, '"',
             'alt="Academy by Posit">',
        '<div id="pa-congrats-copy">',
          '<h1 id="pa-congrats-heading">Congratulations!</h1>',
          '<p id="pa-congrats-sub">You\'ve completed this course. Use the links below to continue your learning journey.</p>',
        '</div>',
        '<button id="pa-confetti-btn" class="pa-congrats-btn pa-congrats-btn-confetti">Fire Confetti</button>',
      '</div>',
      /* Badge row stays hidden unless this course issues a certificate —
         courses without one get the plain congrats banner + nav buttons.
         Card and action rail sit side by side so SkillJar's rating widget
         below stays near the fold. */
      '<div id="pa-badge-row">',
        '<div id="pa-badge-card">',
          buildBadgeSvg(),
          '<span id="pa-badge-sheen" aria-hidden="true"></span>',
        '</div>',
        '<p id="pa-badge-note">Anyone with the verification link can confirm this badge is yours.</p>',
      '</div>',
      '<div id="pa-congrats-buttons">',
        '<a id="pa-btn-linkedin" data-pa-badge="1" class="pa-congrats-btn pa-congrats-btn-primary" style="display:none;" href="', esc(linkedinUrl(null)), '" target="_blank" rel="noopener">Add to LinkedIn</a>',
        '<button id="pa-btn-copy" class="pa-congrats-btn pa-congrats-btn-secondary" style="display:none;">Copy verification link</button>',
        '<a class="pa-congrats-btn pa-congrats-btn-ghost" href="https://partners.posit.co/page/all-courses" target="_self">Browse All Courses</a>',
        '<a class="pa-congrats-btn pa-congrats-btn-ghost" href="https://partners.posit.co" target="_self">Home</a>',
      '</div>',
      '<div id="pa-congrats-divider"></div>'
    ].join('');

    target.insertBefore(wrapper, target.firstChild);

    var btn = document.getElementById('pa-confetti-btn');
    if (btn) btn.addEventListener('click', function () { loadConfetti(fireConfetti); });

    // Reveal the cert-dependent UI once we have a verification URL — right
    // away on a revisit, or via pollCertUrl on first completion while
    // SkillJar issues the certificate in the background.
    function wireCert(url) {
      if (!url) return;
      var shareUrl = buildBadgeUrl() || url;
      var banner = document.getElementById('pa-congrats-banner');
      if (banner) banner.classList.add('pa-compact'); /* badge carries the celebration now */
      var row = document.getElementById('pa-badge-row');
      if (row) row.classList.add('pa-visible'); /* settle/sheen animations play on reveal */
      var sub = document.getElementById('pa-congrats-sub');
      if (sub) sub.textContent = 'You’ve completed this course. Share your achievement or keep exploring.';
      var li = document.getElementById('pa-btn-linkedin');
      if (li) {
        li.href = linkedinUrl(shareUrl, certIdFromUrl(url));
        li.style.display = '';
      }
      var copyBtn = document.getElementById('pa-btn-copy');
      if (copyBtn) {
        copyBtn.style.display = '';
        copyBtn.addEventListener('click', function () {
          navigator.clipboard.writeText(shareUrl).then(function () {
            copyBtn.textContent = 'Copied!';
            setTimeout(function () { copyBtn.textContent = 'Copy verification link'; }, 2000);
          });
        });
      }
      /* confetti button joins the button row, after Copy verification link */
      var confettiBtn = document.getElementById('pa-confetti-btn');
      if (confettiBtn && copyBtn) {
        confettiBtn.classList.add('pa-in-row');
        copyBtn.parentNode.insertBefore(confettiBtn, copyBtn.nextSibling);
      }
    }

    var certUrl = findCertUrl();
    if (certUrl) {
      wireCert(certUrl);
    } else {
      pollCertUrl(wireCert);
    }

    loadConfetti(fireConfetti);
  }

  /* Run after DOMContentLoaded, then retry after load to catch SkillJar's async render */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectCongrats);
  } else {
    injectCongrats();
  }
  window.addEventListener('load', function () {
    setTimeout(injectCongrats, 300);
  });
}());
</script>
<!-- END Posit Academy Post-Course Congratulations + Badge -->
